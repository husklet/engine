name: Publish

on:
  push:
    tags: ["v*.*.*", "verify-v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Crate version to publish
        required: true
        default: 0.1.0
      dry_run:
        description: Run every release gate and package without uploading
        type: boolean
        required: false
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  linux:
    uses: ./.github/workflows/linux.yml

  mac:
    uses: ./.github/workflows/mac.yml

  publish:
    needs: [linux, mac]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          diagnostic-endpoint: ""

      - name: Verify release version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pkgs/rust/Cargo.toml | head -1)
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            requested=${GITHUB_REF_NAME#verify-}
            requested=${requested#v}
          else
            requested='${{ inputs.version }}'
          fi
          test "$requested" = "$version"

      # Recheck the exact tagged checkout in the publishing job. The reusable
      # Linux/macOS jobs above provide the full host test signal; these two
      # release-specific checks prevent a stale or ABI-incompatible prebuilt
      # archive from reaching cargo publish even if those workflows later change.
      - name: Verify crate archives are current
        timeout-minutes: 15
        run: tools/ci_run.sh 720 "Verify crate archives are current" -- nix develop --command make check-crate-archives

      - name: Verify packaged archive launches a guest
        timeout-minutes: 20
        run: tools/ci_run.sh 1020 "Verify packaged archive launches a guest" -- nix develop --command cargo test --release --locked --manifest-path pkgs/rust/Cargo.toml --lib --test packaged_archive

      # Upload retries only transient registry failures. The test jobs and both
      # release-specific archive gates above must all pass before this can run.
      - name: Build and publish Rust crate
        if: ${{ !inputs.dry_run && !startsWith(github.ref_name, 'verify-v') }}
        timeout-minutes: 40
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            nix develop --command cargo publish --manifest-path pkgs/rust/Cargo.toml --locked && exit 0
            if [ "$attempt" -eq 8 ]; then
              exit 1
            fi
            sleep $((attempt * 20))
          done

      - name: Dry-run Rust crate publication
        if: ${{ inputs.dry_run || startsWith(github.ref_name, 'verify-v') }}
        timeout-minutes: 40
        run: tools/ci_run.sh 2220 "Dry-run Rust crate publication" -- nix develop --command cargo publish --dry-run --manifest-path pkgs/rust/Cargo.toml --locked
