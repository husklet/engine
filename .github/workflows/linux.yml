name: Linux

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

concurrency:
  # Pending members of one concurrency group are superseded even when
  # cancel-in-progress is false. Give every main commit its own group so queued
  # verdicts are preserved too; other refs retain normal ref-level coalescing.
  group: linux-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Every commit on main must reach a verdict. Pull requests and other branch
  # pushes may supersede an older run of the same ref.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Host facts as a ::notice annotation. A gate that passes on a dev host and
      # fails here differs by environment, and the job-log endpoint needs admin
      # rights -- so the comparison has to travel through the annotations API.
      - name: Runner environment
        timeout-minutes: 5
        run: tools/ci_env.sh ubuntu-24.04-arm

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Disable the post-run install-diagnostic upload: it periodically hangs
          # for tens of minutes on the runner, stalling the whole job past its
          # timeout even though every test step already passed.
          diagnostic-endpoint: ""

      - uses: nix-community/cache-nix-action@v7
        with:
          # Keyed on flake.lock ONLY, deliberately. The expensive content of this cache is the guest
          # toolchains -- notably the x86_64 musl cross gcc that pkgsStatic.sqlite implies, which
          # nixpkgs does not serve prebuilt for an aarch64 builder and which takes tens of minutes to
          # build from source. Hashing flake.nix too meant every edit to it discarded that toolchain
          # and rebuilt the compiler, even for edits that cannot change the toolchain at all.
          # flake.lock is what pins the nixpkgs those toolchains come from.
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # Granular steps rather than one `nix flake check` so a failure names the
      # thing that broke instead of "check failed". Together these are exactly
      # the four checks `nix flake check` runs.
      - name: Check formatting
        timeout-minutes: 30
        run: tools/ci_run.sh 1620 "Check formatting" -- nix build --print-build-logs .#checks.aarch64-linux.format

      - name: Test C package
        timeout-minutes: 60
        run: tools/ci_run.sh 3420 "Test C package" -- nix build --print-build-logs .#checks.aarch64-linux.package

      - name: Test unit suite (CMake/CTest)
        timeout-minutes: 30
        run: tools/ci_run.sh 1620 "Test unit suite (CMake/CTest)" -- nix build --print-build-logs .#checks.aarch64-linux.unit

      - name: Test Rust package
        timeout-minutes: 30
        run: tools/ci_run.sh 1620 "Test Rust package" -- nix build --print-build-logs .#checks.aarch64-linux.rust

      # The standard build path: configure, build, run the unit suite through
      # CTest, and produce an installable SDK on every push.
      #
      # `ctest -L unit` carries gate.ci-lane-parity, which asserts every lane
      # cmake/CiLanes.cmake declares selects at least one test on this host --
      # the guard against a renamed label silently emptying a shard below.
      # --no-tests=error because `ctest -L <missing>` exits 0 on its own.
      - name: Test CMake build (configure, build, ctest, install)
        timeout-minutes: 30
        run: |
          tools/ci_run.sh 1620 "Test CMake build" -- nix develop --command sh -c '
            set -e
            cmake -G Ninja -B build-ci
            ninja -C build-ci
            ctest --test-dir build-ci -L unit --no-tests=error --output-on-failure
            cmake --install build-ci --prefix "$PWD/build-ci-sdk"
            test -f build-ci-sdk/lib/libhl-engine.a
            test -f build-ci-sdk/lib/pkgconfig/hl-engine.pc
            test -x build-ci-sdk/bin/hl-engine-runner
          '

      # The three Rust gates below are plain `nix develop` steps, NOT flake
      # checks, and that is deliberate. checks.rust is `buildRustPackage` with
      # `doCheck = false` because its sandboxed src is a filtered copy of
      # pkgs/rust that cannot link the frozen libhl-engine.a; wrapping fmt,
      # clippy and the unit tests into derivations would mean three more vendored
      # cargo builds of the same tree for no extra coverage. The devShell already
      # ships rustfmt and clippy, so running them here is the honest, cheap
      # option -- and each is its own step, matching the granularity above, so a
      # failure names the gate that broke.
      #
      # These existed as intent-only until now: Cargo.toml sets
      # `[lints.clippy] all/pedantic = "warn"` and the tree is rustfmt-shaped,
      # but nothing enforced either, so both drifted red on main unnoticed.
      - name: Check Rust formatting
        timeout-minutes: 15
        run: tools/ci_run.sh 720 "Check Rust formatting" -- nix develop --command cargo fmt --manifest-path pkgs/rust/Cargo.toml --check

      # -D warnings promotes the crate's `warn` lint levels to hard errors here
      # only: a local `cargo build` keeps showing them as warnings.
      - name: Lint Rust crate (clippy)
        timeout-minutes: 20
        run: tools/ci_run.sh 1020 "Lint Rust crate (clippy)" -- nix develop --command cargo clippy --manifest-path pkgs/rust/Cargo.toml --all-targets --locked -- -D warnings

      # --lib ONLY. The integration suites (spec, control, terminal, network,
      # e2e) link the frozen activation archive and need a built engine plus
      # guest fixtures; they are covered by the compat lanes and the CMake/CTest
      # step, not here. The lib unit tests are pure host code -- including the
      # wire encoder tests that pin the launch-config ABI against
      # include/hl/config.h -- and are exactly what was silently failing on main.
      - name: Test Rust unit suite
        timeout-minutes: 20
        run: tools/ci_run.sh 1020 "Test Rust unit suite" -- nix develop --command cargo test --manifest-path pkgs/rust/Cargo.toml --locked --lib

      - name: Package Rust crate
        timeout-minutes: 20
        run: tools/ci_run.sh 1020 "Package Rust crate" -- nix develop --command cargo build --release --locked --manifest-path pkgs/rust/Cargo.toml

      # `cargo build` only proves the committed archive under pkgs/rust/assets/lib/
      # links. It is the artifact `cargo publish` ships, and an ABI mismatch
      # between it and include/hl/config.h is a *runtime* rejection, so linking
      # succeeds while every guest launch fails. Releases 0.1.17-0.1.26 shipped an
      # ABI-9 archive against an ABI-13 encoder for exactly that reason. Running
      # the crate's tests here launches a guest through the committed archive.
      # The RELEASE GATE: prove the shipped artifact works. build.rs links a
      # PREBUILT archive under pkgs/rust/assets/lib/, cargo publish ships those
      # exact bytes, and an ABI mismatch between them and include/hl/config.h is a
      # RUNTIME rejection, not a link error -- which is how 0.1.17-0.1.26 shipped an
      # ABI-9 archive against an ABI-13 encoder and broke every guest launch. This
      # step must catch that, and it does: packaged_archive launches guest fixtures
      # on both backends through the committed archive, and --lib checks the pure
      # encoding/validation logic. Both are host-independent, so this gate is fast
      # and cannot be flaked by the runner.
      - name: Gate — packaged archive launches a guest, and lib logic
        timeout-minutes: 15
        run: tools/ci_run.sh 720 "Gate — packaged archive launches a guest, and lib logic" -- nix develop --command cargo test --release --locked --manifest-path pkgs/rust/Cargo.toml --lib --test packaged_archive

      # The full integration suite (spec, e2e, alpine, container, control, ...)
      # exercises deep host behaviour -- checkpoint capture, private fd bands,
      # tmpfs/overlay coherence, unix-socket peek accounting. This is a HARD GATE:
      # every test must pass or genuinely self-skip. The only two dispositions that
      # are not a plain pass are legitimate runtime self-skips for capabilities the
      # hosted runner lacks, each of which detects the real incapability at runtime
      # and prints a visible SKIP reason:
      #   * the checkpoint suites self-skip via the real capture probe in
      #     tests/support/checkpoint_env.rs;
      #   * typed_machines_cross_the_old_private_descriptor_ceiling self-skips via
      #     its /proc/self/limits private-descriptor-band check.
      # There is no continue-on-error and no --skip masking list: a real regression
      # fails the job.
      #
      # --no-fail-fast because cargo otherwise stops at the first failing target:
      # a red `spec` hid whatever `terminal` and `traits` would have said, and the
      # public check-run data carries only the annotation this step emits. It
      # weakens nothing -- every failure still fails the job, there are just more
      # of them named in one run.
      - name: Full Rust integration suite
        timeout-minutes: 25
        run: tools/ci_run.sh 1320 "Full Rust integration suite" -- nix develop --command cargo test --release --locked --no-fail-fast --manifest-path pkgs/rust/Cargo.toml

      # The launch and integration tests above prove the committed archive
      # works. This final hard gate independently proves that it is current.
      # Keep freshness last: regenerating both host archives requires an
      # aarch64 Linux host plus Apple silicon, so this runner can report but
      # cannot remediate staleness. A stale manifest must not prevent the
      # stronger release and integration gates from reporting their results.
      - name: Check the committed crate archives are intact
        timeout-minutes: 15
        run: tools/ci_run.sh 720 "Check the committed crate archives are intact" -- nix develop --command bash tools/check_crate_archives.sh --skip-freshness

  # Runtime compatibility, sharded across parallel runners. `targets` names CTest
  # LABELS, and cmake/CiLanes.cmake is the source of truth for the set: I14 fails
  # if a declared lane is missing here or named twice, and gate.ci-lane-parity
  # (in the unit lane above) fails if a lane selects zero tests.
  #
  # compat-network carries the plain suite AND the ICMP-denied bridge rerun, so
  # the former `typed-network` + `typed-network-icmp` pair is one label now.
  #
  # FIVE buckets covering all 24 sharded lanes -- the same runner count as when
  # they covered 16. Bucket contents are balanced on MEASURED per-lane suite
  # wall clock (aarch64 Linux, tmpfs scratch, seconds):
  #   soak 263 | memory 123 | ipc 36 time 27 threads 19 signals 18
  #   core-workload 21 process 17 syscall-edges 15 core-syscall 12
  #   isa-x86-64 11 syscall 10 | completeness 8 posix 8 abi-corpus 6
  #   filesystem 6 libc 5 network 5 abi 4 procfs 4 core-abi 2 core-regress 2
  #   isa-aarch64 2 isolation 2
  # compat-soak alone is 263s of the 626s total, so it is the critical path and
  # NO split across three or more buckets can finish sooner. The mac lane was
  # consolidated 5->2 because macos-26 admission, not compute, was its
  # bottleneck; ubuntu-24.04-arm has no such queue, and each bucket pays a real
  # cost the mac's does not -- it builds `compat-engines` plus its own guest
  # corpus. Fewer buckets would concentrate that build without shortening the
  # job, so the count stays at five and the lanes are spread for retry headroom.
  linux-compat:
    name: compat / ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: soak
            targets: compat-soak
          - name: memory
            targets: compat-memory
          - name: ipc-time-threads
            targets: compat-ipc compat-time compat-threads compat-signals
          - name: core-syscall
            targets: compat-core-workload compat-process compat-syscall-edges compat-core-syscall compat-isa-x86-64 compat-syscall
          - name: abi-fs-net
            targets: compat-completeness compat-posix compat-abi-corpus compat-filesystem compat-libc compat-network compat-abi compat-procfs compat-core-abi compat-core-regress compat-isa-aarch64 compat-isolation
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          diagnostic-endpoint: ""
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Compat suites
        timeout-minutes: 55
        shell: bash
        run: |
          set -o pipefail
          # The typed compat scratch is mapped as the guest's /tmp; on this ext4
          # runner it must be tmpfs-backed for statx-btime/memfd-seals to behave.
          sudo mkdir -p /mnt/hl-scratch && sudo mount -t tmpfs -o size=4G tmpfs /mnt/hl-scratch && sudo chmod 1777 /mnt/hl-scratch
          # NOT exported globally: the scratch filesystem is per-lane, see
          # scratch_for() below. Suites with no entry get the tmpfs.
          tmpfs_scratch=/mnt/hl-scratch
          # Portable bound: output to a FILE, never a pipe. The compat suite leaves
          # processes alive by design (pc-forkoutlive has a child outlive its parent;
          # the fork-server/supervisor are long-lived) and they inherit this step's
          # stdout, so a reader on a pipe can wait for an EOF that never comes.
          run_bounded() {
            local secs="$1" log="$2"; shift 2
            "$@" >"$log" 2>&1 </dev/null &
            local pid=$! waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge "$secs" ]; then
                kill -TERM "$pid" 2>/dev/null; sleep 10; kill -KILL "$pid" 2>/dev/null
                wait "$pid" 2>/dev/null; return 124
              fi
              sleep 5; waited=$((waited + 5))
            done
            wait "$pid"
          }
          # Retry ONCE, matching the macOS lane. Several cases are stress gates with timing
          # bounds that a contended runner can miss -- truncate-eof-bus timed out here with
          # empty stdout while passing 8/8 locally. A genuine break still fails both attempts;
          # the first-attempt failure is surfaced as a ::warning so a real intermittent bug
          # stays visible rather than being silently greened by the retry.
          # Build ONCE, then one `ctest` PER LANE. Several suites contain
          # load-sensitive stress gates whose symptom under concurrency was cases
          # timing out after the full 120s per-case budget having produced ZERO
          # bytes of output (mkfifoat, truncate-eof-bus). Building stays parallel;
          # suites run one at a time. Each lane builds only its own guest corpus.
          # Bound the STEP, not just one suite. Several suites plus the retry can
          # outlast the 55min step timeout, and a step GitHub kills emits no
          # ::error, so the failure lands with no diagnostic tail. Stop 60s short
          # of the deadline so the reporting tail below always runs.
          # 3180+60 <= 55*60, and 55 <= the 60min job timeout -- I18 checks both.
          # Raised from 2280/40min with the lane count: the widest bucket now
          # cross-builds twelve suites' guest corpora before any case runs, and
          # compat-soak's bucket must fit 263s of suite time twice if it retries.
          deadline=$((SECONDS + 3180))
          budget() {
            local left=$((deadline - SECONDS - 60))
            if [ "$left" -gt 0 ]; then echo "$left"; else echo 0; fi
          }
          # Build only this lane's engines and guest corpus, inside the same
          # deadline so a hung build still reports instead of being step-killed.
          fixtures=""
          for t in ${{ matrix.targets }}; do fixtures="$fixtures $t-fixtures"; done
          bst=0
          run_bounded "$(budget)" build.log \
            nix develop --command sh -c "cmake -G Ninja -B build-ci && cmake --build build-ci --parallel \"\$(nproc)\" --target compat-engines$fixtures" || bst=$?
          if [ "$bst" -ne 0 ]; then
            msg=$(tail -c 1500 build.log); msg=${msg//'%'/'%25'}; msg=${msg//$'\n'/'%0A'}; msg=${msg//$'\r'/'%0D'}
            echo "::error title=Linux compat (${{ matrix.name }}) build failed::$msg"
            exit 1
          fi
          # The scratch dir is the guest's /tmp, so its filesystem is an INPUT to
          # every case that touches a file. Most suites want the tmpfs mounted
          # above; compat-core-syscall does not. Its edge_fallocate golden needs
          # FALLOC_FL_ZERO_RANGE, which tmpfs does not implement: a plain `cc`
          # build of the case prints the engine's exact tmpfs output (zero_rc=-1)
          # natively, and the golden's output on a loopback ext4. Forcing tmpfs
          # here would be testing tmpfs rather than the engine. Leaving the
          # variable unset puts the scratch under the build tree, i.e. the
          # runner's ext4 -- the filesystem the goldens were captured against,
          # where the whole suite is 57/57.
          # matrix-runner's per-case hang detector is 120s, which the endurance
          # cases do not fit on a runner-sized machine: soak/reallocchurn is 124s
          # (aarch64) and 112s (x86_64) pinned to four CPUs on an otherwise idle
          # host, versus a fraction of that on a whole machine. It is real compute,
          # not a hang -- the case produces its exact golden sum every time -- so
          # give compat-soak a budget that matches its own CTest TIMEOUT instead of
          # blunting the detector for the suites where 120s is generous.
          env_for() {
            scratch_for "$1"
            case "$1" in
            compat-soak) export HL_MATRIX_CASE_TIMEOUT_MS=600000 ;;
            *) unset HL_MATRIX_CASE_TIMEOUT_MS ;;
            esac
          }
          scratch_for() {
            case "$1" in
            compat-core-syscall) unset HL_MATRIX_SCRATCH_DIR ;;
            *) export HL_MATRIX_SCRATCH_DIR="$tmpfs_scratch" ;;
            esac
          }
          run_suites() {
            local st=0 suite_st=0 cap=0 t=
            : > "$1"
            for t in ${{ matrix.targets }}; do
              suite_st=0
              env_for "$t"
              cap=$(budget)
              if [ "$cap" -le 0 ]; then st=124; break; fi
              if [ "$cap" -gt 2100 ]; then cap=2100; fi
              # --no-tests=error: `ctest -L <missing>` exits 0, so without it a
              # renamed label turns this step silently green. I15 enforces it.
              run_bounded "$cap" "$1.part" \
                nix develop --command ctest --test-dir build-ci -L "^$t\$" --no-tests=error --output-on-failure || suite_st=$?
              cat "$1.part" >> "$1"
              if [ "$suite_st" -ne 0 ]; then
                # Preserve timeout as the most informative aggregate status,
                # but continue so one broken suite cannot hide its siblings.
                if [ "$suite_st" -eq 124 ]; then
                  st=124
                elif [ "$st" -eq 0 ]; then
                  st="$suite_st"
                fi
              fi
            done
            tail -n 60 "$1"
            return $st
          }
          status=0
          verdict='step budget exhausted before a retry'
          run_suites runtime.log || status=$?
          # Retry only with enough budget left to finish and still report.
          if [ "$status" -ne 0 ] && [ "$(budget)" -ge 600 ]; then
            verdict='both attempts'
            warn=$(tail -c 1200 runtime.log)
            warn=${warn//'%'/'%25'}; warn=${warn//$'\n'/'%0A'}; warn=${warn//$'\r'/'%0D'}
            echo "::warning title=Linux compat (${{ matrix.name }}) failed attempt 1 — retrying::$warn"
            status=0
            run_suites runtime.log || status=$?
          fi
          tail -c 200000 runtime.log >> "$GITHUB_STEP_SUMMARY" || true
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 1500 runtime.log)
            message=${message//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            if [ "$status" -eq 124 ]; then
              echo "::error title=Linux compat (${{ matrix.name }}) TIMED OUT ($verdict)::$message"
            else
              echo "::error title=Linux compat (${{ matrix.name }}) failed ($verdict)::$message"
            fi
            exit 1
          fi
