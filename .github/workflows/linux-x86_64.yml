name: Linux x86-64

# The x86_64 Linux HOST lane. A file of its own because I13/I14 map one workflow
# file to one HL_CI_SHARDED_* list, and because linux.yml's per-SHA concurrency
# group is tuned to a lane that keeps up.
#
# Scope: configure, build the host libraries, production engines and both guest
# fixture corpora, run the `unit`, `nested-engine` and `emulated-aarch64-gated`
# lanes -- the last EMULATED, see that step -- and link an x86_64 host archive into
# the crate. Guests DO run here; every other lane is absent because it is not green
# yet. Split HL_CI_SHARDED_LINUX per
# host CPU BEFORE declaring Linux-x86_64 in HL_CI_COMPAT_HOSTS: declaring it
# switches I20 off and leaves this file with no structural guard at all.
#
# publish.yml does NOT need this job and P1 still pins `needs: [linux, mac]`: a
# release ships two aarch64 archives. Revisit once this host gates compat.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

concurrency:
  # As linux.yml: a main commit keeps its own group, other refs coalesce by ref.
  group: linux-x86-64-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    # Two full engine builds plus ~3000 cross-built guest fixtures, no warm cache.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      # Host facts as a ::notice: the job-log endpoint needs admin rights.
      - name: Runner environment
        timeout-minutes: 5
        run: tools/ci_env.sh ubuntu-24.04

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # The post-run diagnostic upload periodically hangs for tens of minutes.
          diagnostic-endpoint: ""

      - uses: nix-community/cache-nix-action@v7
        with:
          # runner.arch keeps this disjoint from the aarch64 lane's cache. flake.lock
          # only (see linux.yml): hashing flake.nix discarded the cross toolchains.
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      # The x86_64-linux attribute of the derivation linux.yml builds on aarch64.
      # No `.#checks.x86_64-linux.rust`: flake.nix gates the crate outputs on
      # `hasCrateArchive`, false without a committed archive.
      - name: Test C package
        timeout-minutes: 60
        run: tools/ci_run.sh 3420 "Test C package" -- nix build --print-build-logs .#checks.x86_64-linux.package

      - name: Test unit suite (Nix check)
        timeout-minutes: 30
        run: tools/ci_run.sh 1620 "Test unit suite (Nix check)" -- nix build --print-build-logs .#checks.x86_64-linux.unit

      # The INVERSE gate: an x86_64 runner compiles only the x86_64 arm of every
      # host-CPU guard and the aarch64 runners only the other, so the risk that
      # matters is amd64 work breaking the aarch64 host that ships. Building the
      # HL_HOST_CPU_AARCH64 arms here catches it with no aarch64 hardware, and
      # -DHL_BUILD_TESTS=OFF must stay off because only compilation is the point.
      #
      # It is no longer only compilation: the `nested-engine` gate in the next step
      # RUNS these two binaries as guests of this host's engines, so build-arm-check
      # must exist before it. Move or rename this tree and that gate reports SKIPPED
      # rather than passing.
      - name: Cross-compile the aarch64 host arms
        timeout-minutes: 25
        run: |
          tools/ci_run.sh 1440 "Cross-compile the aarch64 host arms" -- nix develop --command sh -c '
            set -e
            cmake -G Ninja -B build-arm-check -DHL_BUILD_TESTS=OFF \
              -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux.cmake
            ninja -C build-arm-check -k 0
            test -f build-arm-check/linux-production/hl-engine-linux-aarch64
            test -f build-arm-check/linux-production/hl-engine-linux-x86_64
          '

      # The gate this job exists for. The sandboxed check above has no guest cross
      # compilers, so cmake/LaneParity.cmake declines to register there and
      # gate.ci-lane-parity runs HERE and nowhere else on this host CPU, asserting
      # every lane cmake/CiLanes.cmake declares is non-empty on (Linux, x86_64).
      # --no-tests=error because `ctest -L <missing>` exits 0 (I15).
      #
      # `nested-engine` is the branch's acceptance criterion, engine in engine. All
      # six cells run here, because this is the only host where BOTH engine ELF
      # arches exist: build-arm-check above supplies the aarch64 ones. ~130s.
      # -V, not --output-on-failure: CTest prints nothing for a SKIPPED test, and a
      # skip here means build-arm-check went missing -- whose whole point is to say
      # so and name the fix.
      - name: Test CMake build (configure, build, ctest, install)
        timeout-minutes: 75
        run: |
          tools/ci_run.sh 4440 "Test CMake build" -- nix develop --command sh -c '
            set -e
            cmake -G Ninja -B build-ci
            ninja -C build-ci
            ctest --test-dir build-ci -L unit --no-tests=error --output-on-failure
            ctest --test-dir build-ci -L nested-engine --no-tests=error -V
            cmake --install build-ci --prefix "$PWD/build-ci-sdk"
            test -f build-ci-sdk/lib/libhl-engine.a
            test -f build-ci-sdk/lib/pkgconfig/hl-engine.pc
            test -x build-ci-sdk/bin/hl-engine-runner
          '

      # EMULATION, NOT HARDWARE -- and the ONLY place any CI job executes the
      # aarch64 host arm cross-compiled two steps up: the aarch64 runners never
      # compile the x86_64 arms and this runner never ran the aarch64 host, which is
      # how several JIT defects on this branch merged without ever running.
      #
      # Instruction semantics, the W^X arena and signal delivery are covered;
      # weak memory ordering is NOT,
      # since qemu-user inherits this x86 host's stronger model -- a missing dmb in
      # the IBTC or STW paths passes here and can still fail on silicon. Evidence,
      # never proof, and never a substitute for an aarch64 runner.
      #
      # The label is the GREEN subset (cmake/Phase3Gates.cmake 9b): emulated.abi is
      # the control, emulated.completeness is excluded while genuinely red. -V, as
      # for nested-engine: CTest prints NOTHING for a skip, and a skip here means
      # qemu-aarch64 or build-arm-check went missing.
      - name: Test the aarch64 host under emulation (qemu-user)
        timeout-minutes: 30
        run: |
          tools/ci_run.sh 1740 "Test the aarch64 host under emulation (qemu-user)" -- nix develop --command sh -c '
            ctest --test-dir build-ci -L emulated-aarch64-gated --no-tests=error -V
          '

      # BUILT here, never committed: a third archive against the 10MB crates.io
      # budget is a publication decision. Only CI coverage of build.rs's x86_64 arm.
      - name: Build the x86_64 crate archive
        timeout-minutes: 40
        run: tools/ci_run.sh 2340 "Build the x86_64 crate archive" -- nix develop --command cmake --build build-ci --target refresh-crate-archives-linux

      # --lib ONLY, like linux.yml: the integration suites and packaged_archive
      # launch guests. These link the archive above, proving build.rs's link line.
      - name: Test Rust unit suite against the built archive
        timeout-minutes: 20
        run: tools/ci_run.sh 1020 "Test Rust unit suite against the built archive" -- nix develop --command cargo test --manifest-path pkgs/rust/Cargo.toml --locked --lib

      # -D warnings promotes the crate's `warn` lint levels to errors here only.
      # This ran inside `ctest -L unit` WITHOUT the archive; rerunning it now
      # covers the other side of build.rs's branch.
      - name: Lint Rust crate (clippy)
        timeout-minutes: 20
        run: tools/ci_run.sh 1020 "Lint Rust crate (clippy)" -- nix develop --command cargo clippy --manifest-path pkgs/rust/Cargo.toml --all-targets --locked -- -D warnings
