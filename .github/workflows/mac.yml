name: macOS

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

concurrency:
  # Pending members of one concurrency group are superseded even when
  # cancel-in-progress is false. Give every main commit its own group so queued
  # verdicts are preserved too; other refs retain normal ref-level coalescing.
  group: mac-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Every commit on main must reach a verdict. Pull requests and other branch
  # pushes may supersede an older run of the same ref.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Core build + host-service + gates. Fast (~30-40min); no compat corpus here.
  mac:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Disable the post-run install-diagnostic upload: it periodically hangs
          # for tens of minutes on the runner, stalling the whole job past its
          # timeout even though every test step already passed.
          diagnostic-endpoint: ""
      - uses: nix-community/cache-nix-action@v7
        with:
          # Keyed on flake.lock ONLY, deliberately. The expensive content of this cache is the guest
          # toolchains -- notably the x86_64 musl cross gcc that pkgsStatic.sqlite implies, which
          # nixpkgs does not serve prebuilt for an aarch64 builder and which takes tens of minutes to
          # build from source. Hashing flake.nix too meant every edit to it discarded that toolchain
          # and rebuilt the compiler, even for edits that cannot change the toolchain at all.
          # flake.lock is what pins the nixpkgs those toolchains come from.
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Test C package
        timeout-minutes: 45
        run: tools/ci_run.sh 2520 "Test C package" -- nix build --print-build-logs .#checks.aarch64-darwin.package

      # doCheck=false on darwin, so run the runtime suites unsandboxed here (they
      # need "/", "/tmp", JIT, localhost DNS). Configure + build once for every
      # CTest lane in this job. CMake resolves the archiver from the compiler
      # wrapper, so the AR=ar override `make` needed against the dev shell's
      # cross-ar is gone.
      - name: Configure and build (CMake)
        timeout-minutes: 30
        run: tools/ci_run.sh 1620 "Configure and build (CMake)" -- nix develop --command sh -c 'cmake -G Ninja -B build-ci && cmake --build build-ci --parallel "$(sysctl -n hw.ncpu)"'

      # Carries gate.ci-lane-parity: every lane cmake/CiLanes.cmake declares must
      # select at least one test on this host. --no-tests=error throughout,
      # because `ctest -L <missing>` exits 0 on its own. I15 enforces it.
      - name: Test C unit suite
        timeout-minutes: 25
        run: tools/ci_run.sh 1320 "Test C unit suite" -- nix develop --command ctest --test-dir build-ci -L "^unit$" --no-tests=error --output-on-failure

      - name: Test C package integration
        timeout-minutes: 25
        run: tools/ci_run.sh 1320 "Test C package integration" -- nix develop --command ctest --test-dir build-ci -L "^package$" --no-tests=error --output-on-failure

      - name: Test Rust package
        timeout-minutes: 25
        run: tools/ci_run.sh 1320 "Test Rust package" -- nix build --print-build-logs .#checks.aarch64-darwin.rust

      # The only Darwin host in CI, so the only place the committed
      # aarch64-apple-darwin archive can be repacked and force-loaded into a
      # real link. The Linux runner runs the same gate but defers that part.
      - name: Check the committed crate archives are intact
        timeout-minutes: 15
        run: tools/ci_run.sh 720 "Check the committed crate archives are intact" -- nix develop --command bash tools/check_crate_archives.sh --skip-freshness

      - name: Test macOS host services
        timeout-minutes: 30
        shell: bash
        run: |
          set -o pipefail
          # The native host-services tests (fork-after-Foundation-init, DNS/resolver) are deterministic
          # on a real host (90/90 in a local loop) but occasionally fail env-specifically on the
          # sandboxed/SIP-on macos-26 runner. Surface the failing tail and retry once so transient
          # runner divergence self-heals; a consistent failure still fails both attempts. Per-binary
          # 180s per-test TIMEOUT properties already bound any hang and name the culprit.
          # Portable bound: macOS runners ship no GNU `timeout` (and no gtimeout), so this replaces it.
          # Output goes to a FILE, never a pipe. The compat suite deliberately leaves processes alive
          # (pc-forkoutlive has a child outlive its parent; the fork-server/supervisor are long-lived) and
          # they inherit this step's stdout, so with `| tee` the reader can wait on an EOF that never
          # comes. A file has no reader to block. Returns 124 on expiry.
          run_bounded() {
            local secs="$1" log="$2"; shift 2
            "$@" >"$log" 2>&1 </dev/null &
            local pid=$! waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge "$secs" ]; then
                kill -TERM "$pid" 2>/dev/null; sleep 10; kill -KILL "$pid" 2>/dev/null
                wait "$pid" 2>/dev/null; return 124
              fi
              sleep 5; waited=$((waited + 5))
            done
            wait "$pid"
          }
          # Two 22min attempts do not fit the 30min step timeout, and a step
          # GitHub kills emits no ::error. Bound both attempts by one deadline.
          deadline=$((SECONDS + 1680))
          budget() {
            local left=$((deadline - SECONDS - 60))
            if [ "$left" -gt 0 ]; then echo "$left"; else echo 0; fi
          }
          run_tm() {
            local st=0 cap=
            cap=$(budget)
            if [ "$cap" -le 0 ]; then return 124; fi
            if [ "$cap" -gt 1320 ]; then cap=1320; fi
            run_bounded "$cap" "$1" \
              nix develop --command ctest --test-dir build-ci -L "^macos$" --no-tests=error --output-on-failure || st=$?
            tail -n 60 "$1"
            return $st
          }
          status=0
          verdict='step budget exhausted before a retry'
          run_tm tm.log || status=$?
          if [ "$status" -ne 0 ] && [ "$(budget)" -ge 400 ]; then
            verdict='both attempts'
            warn=$(tail -c 1500 tm.log); warn=${warn//'%'/'%25'}; warn=${warn//$'\n'/'%0A'}; warn=${warn//$'\r'/'%0D'}
            echo "::warning title=test-macos failed attempt 1 — retrying::$warn"
            status=0
            run_tm tm.log || status=$?
          fi
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 1500 tm.log); message=${message//'%'/'%25'}; message=${message//$'\n'/'%0A'}; message=${message//$'\r'/'%0D'}
            echo "::error title=test-macos failed ($verdict)::$message"
            exit 1
          fi

      - name: Run e2e gates
        timeout-minutes: 30
        shell: bash
        # Retry ONCE, matching the compat and test-macos steps. These gates spawn
        # guests, force-stop them, and assert expected signals/exits -- timing that
        # a contended macos-26 runner can occasionally miss even though the gates
        # pass 3/3 locally on a real mac and passed the plain push run on this same
        # commit. This is NOT continue-on-error: a genuine break fails both
        # attempts. The first-attempt failure is surfaced as a ::warning so a real
        # intermittent stays visible rather than being silently greened.
        run: |
          set -o pipefail
          # The gates spawn guests that outlive their parent, so output goes to a
          # FILE: a `tee` reader can wait on an EOF that never comes. One
          # deadline bounds both attempts, under the 30min step timeout, so a
          # hang still produces the ::error tail instead of a silent step kill.
          run_bounded() {
            local secs="$1" log="$2"; shift 2
            "$@" >"$log" 2>&1 </dev/null &
            local pid=$! waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge "$secs" ]; then
                kill -TERM "$pid" 2>/dev/null; sleep 10; kill -KILL "$pid" 2>/dev/null
                wait "$pid" 2>/dev/null; return 124
              fi
              sleep 5; waited=$((waited + 5))
            done
            wait "$pid"
          }
          deadline=$((SECONDS + 1680))
          budget() {
            local left=$((deadline - SECONDS - 60))
            if [ "$left" -gt 0 ]; then echo "$left"; else echo 0; fi
          }
          run_gates() {
            local st=0 cap=
            cap=$(budget)
            if [ "$cap" -le 0 ]; then return 124; fi
            if [ "$cap" -gt 780 ]; then cap=780; fi
            run_bounded "$cap" "$1" \
              nix develop --command ctest --test-dir build-ci -L "^e2e-mac$" --no-tests=error --output-on-failure || st=$?
            tail -n 60 "$1"
            return $st
          }
          status=0
          verdict='step budget exhausted before a retry'
          run_gates gates.log || status=$?
          if [ "$status" -ne 0 ] && [ "$(budget)" -ge 400 ]; then
            verdict='both attempts'
            warn=$(tail -c 1200 gates.log); warn=${warn//'%'/'%25'}; warn=${warn//$'\n'/'%0A'}; warn=${warn//$'\r'/'%0D'}
            echo "::warning title=e2e-mac-gates failed attempt 1 — retrying::$warn"
            status=0
            run_gates gates.log || status=$?
          fi
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 1500 gates.log); message=${message//'%'/'%25'}; message=${message//$'\n'/'%0A'}; message=${message//$'\r'/'%0D'}
            echo "::error title=e2e-mac-gates failed ($verdict)::$message"
            exit 1
          fi

      - name: Package Rust crate
        timeout-minutes: 20
        run: tools/ci_run.sh 1020 "Package Rust crate" -- nix develop --command cargo build --release --locked --manifest-path pkgs/rust/Cargo.toml

      # `cargo build` only proves the committed archive under pkgs/rust/assets/lib/
      # links. It is the artifact `cargo publish` ships, and an ABI mismatch
      # between it and include/hl/config.h is a *runtime* rejection, so linking
      # succeeds while every guest launch fails. Releases 0.1.17-0.1.26 shipped an
      # ABI-9 archive against an ABI-13 encoder for exactly that reason. Running
      # the crate's tests here launches a guest through the committed archive.
      #
      # Only the guard suite runs on macOS. The rest of the crate's integration
      # tests build static Linux guest probes with `cc` at test time (impossible
      # here) or exercise checkpoint/restore, which is Linux-host only and which
      # `e2e-mac-gates` likewise excludes. `packaged_archive` needs neither: it
      # runs the committed testdata fixtures on both guest backends.
      - name: Test Rust crate against the committed archive
        timeout-minutes: 25
        run: tools/ci_run.sh 1320 "Test Rust crate against the committed archive" -- nix develop --command cargo test --release --locked --manifest-path pkgs/rust/Cargo.toml --test packaged_archive

  # Runtime compatibility suites. TWO buckets, not five: a capacity decision,
  # not a speed one. This lane is admission-bound, not compute-bound. Measured
  # on runs 30077011935 and 30163475795, a shard spends ~2.5min on nix install
  # plus cache restore and 0.7-4.3min on suites, yet each job waited 7-10min
  # for a macos-26 runner, and the backlog reached 23 pending runs -- the
  # oldest 2h05m without starting, a release tag behind it. Six jobs per push
  # is what the queue cannot serve, so halve it: the slowest bucket grows to
  # ~8.4min of suite time, far less than the queue delay removed, and the
  # fixed ~2.5min is paid twice instead of five times.
  #
  # Coverage is untouched: the goal lists below are the same 21 goals the five
  # buckets named, redistributed, balanced on measured per-suite wall clock
  # (328s vs 326s of 654s, Apple silicon). I13 fails if one is dropped or
  # duplicated.
  mac-compat:
    name: compat / ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 95
    strategy:
      fail-fast: false
      # `name` is what shows up in the checks list; `targets` is the CTest label list.
      matrix:
        include:
          - name: abi-isa-ipc
            targets: compat-abi-corpus compat-abi compat-core-abi compat-core-syscall compat-core-regress compat-core-workload compat-isa-x86-64 compat-isa-aarch64 compat-completeness compat-network compat-ipc compat-syscall compat-syscall-edges compat-libc
          - name: fs-mem-posix
            targets: compat-filesystem compat-threads compat-memory compat-process compat-procfs compat-isolation compat-posix compat-signals compat-soak compat-time
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          # Disable the post-run install-diagnostic upload: it periodically hangs
          # for tens of minutes on the runner, stalling the whole job past its
          # timeout even though every test step already passed.
          diagnostic-endpoint: ""
      - uses: nix-community/cache-nix-action@v7
        with:
          # Keyed on flake.lock ONLY, deliberately. The expensive content of this cache is the guest
          # toolchains -- notably the x86_64 musl cross gcc that pkgsStatic.sqlite implies, which
          # nixpkgs does not serve prebuilt for an aarch64 builder and which takes tens of minutes to
          # build from source. Hashing flake.nix too meant every edit to it discarded that toolchain
          # and rebuilt the compiler, even for edits that cannot change the toolchain at all.
          # flake.lock is what pins the nixpkgs those toolchains come from.
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-

      - name: Compat suites
        timeout-minutes: 90
        shell: bash
        run: |
          set -o pipefail
          # Portable bound: macOS runners ship no GNU `timeout` (and no gtimeout), so this replaces it.
          # Output goes to a FILE, never a pipe. The compat suite deliberately leaves processes alive
          # (pc-forkoutlive has a child outlive its parent; the fork-server/supervisor are long-lived) and
          # they inherit this step's stdout, so with `| tee` the reader can wait on an EOF that never
          # comes. A file has no reader to block. Returns 124 on expiry.
          run_bounded() {
            local secs="$1" log="$2"; shift 2
            "$@" >"$log" 2>&1 </dev/null &
            local pid=$! waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge "$secs" ]; then
                kill -TERM "$pid" 2>/dev/null; sleep 10; kill -KILL "$pid" 2>/dev/null
                wait "$pid" 2>/dev/null; return 124
              fi
              sleep 5; waited=$((waited + 5))
            done
            wait "$pid"
          }
          # Bound the STEP, not just one suite: eleven suites plus retries can
          # outlast the 90min step timeout, and a step GitHub kills emits no
          # ::error, so the failure lands with no diagnostic tail. Stop 60s short
          # of the deadline so the reporting tail below always runs. Raising the
          # step timeout above must raise this with it -- I18 enforces that.
          deadline=$((SECONDS + 5280))
          budget() {
            local left=$((deadline - SECONDS - 60))
            if [ "$left" -gt 0 ]; then echo "$left"; else echo 0; fi
          }
          # One `ctest` PER LANE -- see the note in linux.yml. Suites run one at a
          # time: they bind ports, create System V keys and share scratch, and the
          # symptom of overlap is a case timing out after the full 120s per-case
          # budget with ZERO bytes of output. Building stays parallel.
          run_suite() {
            local st=0 cap=
            cap=$(budget)
            if [ "$cap" -gt 2400 ]; then cap=2400; fi
            # --no-tests=error: `ctest -L <missing>` exits 0, so without it a
            # renamed label turns this step silently green. I15 enforces it.
            run_bounded "$cap" "$2" \
              nix develop --command ctest --test-dir build-ci -L "^$1\$" --no-tests=error --output-on-failure || st=$?
            return $st
          }
          annotate() {
            local text=
            text=$(tail -c 1500 "$3")
            text=${text//'%'/'%25'}; text=${text//$'\n'/'%0A'}; text=${text//$'\r'/'%0D'}
            echo "::$1 title=$2::$text"
          }
          # Build this bucket's engines and guest corpus once, inside the same
          # deadline so a hung build still reports instead of being step-killed.
          fixtures=""
          for t in ${{ matrix.targets }}; do fixtures="$fixtures $t-fixtures"; done
          bst=0
          run_bounded "$(budget)" build.log \
            nix develop --command sh -c "cmake -G Ninja -B build-ci && cmake --build build-ci --parallel \"\$(sysctl -n hw.ncpu)\" --target compat-engines$fixtures" || bst=$?
          if [ "$bst" -ne 0 ]; then
            annotate error "macOS compat (${{ matrix.name }}) build failed" build.log
            exit 1
          fi
          # A few load-sensitive stress gates (e.g. the IPC pump-primary-channel epoll->kqueue
          # bring-up gate: 12000 jittered rounds + a liveness watchdog) can exceed their timing
          # bound on a heavily-contended macos-26 runner even though they pass deterministically
          # on a real host. Retry ONCE so that self-heals; a genuine break fails both attempts and
          # the first failure is surfaced as a ::warning, never silently swallowed. The retry is
          # PER SUITE, not per bucket: with eleven suites in a bucket, re-running ten that passed
          # to recheck one would spend the whole step deadline.
          status=0
          failed=
          exhausted=
          : > runtime.log
          for t in ${{ matrix.targets }}; do
            if [ "$(budget)" -le 0 ]; then
              exhausted="$exhausted $t"
              status=124
              continue
            fi
            st=0
            run_suite "$t" part.log || st=$?
            if [ "$st" -ne 0 ] && [ "$(budget)" -ge 600 ]; then
              annotate warning "macOS compat ($t) failed attempt 1 — retrying" part.log
              cat part.log >> runtime.log
              st=0
              run_suite "$t" part.log || st=$?
            fi
            cat part.log >> runtime.log
            # Continue past a failure so one broken suite cannot hide its
            # siblings, but keep a timeout as the aggregate status: it is the
            # more informative verdict.
            if [ "$st" -ne 0 ]; then
              failed="$failed $t"
              if [ "$st" -eq 124 ]; then status=124; elif [ "$status" -eq 0 ]; then status="$st"; fi
            fi
          done
          tail -c 200000 runtime.log >> "$GITHUB_STEP_SUMMARY" || true
          tail -n 60 runtime.log
          if [ "$status" -ne 0 ]; then
            verdict=
            if [ -n "$failed" ]; then
              verdict="both attempts of:$failed"
            fi
            if [ -n "$exhausted" ]; then
              verdict="${verdict:+$verdict; }step budget exhausted before:$exhausted"
            fi
            if [ "$status" -eq 124 ]; then
              annotate error "macOS compat (${{ matrix.name }}) TIMED OUT ($verdict)" runtime.log
            else
              annotate error "macOS compat (${{ matrix.name }}) failed ($verdict)" runtime.log
            fi
            exit 1
          fi
