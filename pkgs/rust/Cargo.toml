[package]
name = "hl-engine"
version = "0.1.34"
edition = "2021"
rust-version = "1.81"
description = "Safe Rust lifecycle API for the standalone HL Linux guest engine"
license = "MIT"
repository = "https://github.com/husklet/engine"
readme = "README.md"
keywords = ["linux", "emulation", "jit", "sandbox"]
categories = ["emulators", "api-bindings"]
# Published crate stays under crates.io's 10 MB compressed limit. The two
# prebuilt libhl-engine.a archives (~48 MB uncompressed) are mandatory —
# build.rs links them — so the room is made by excluding TEST-ONLY assets that
# a downstream consumer never uses: the alpine rootfs fixture, the testdata
# guest binaries, and the integration tests themselves. They are only needed to
# run this crate's own tests, which happens in the repo, not from the published
# package. Dropping them took 0.1.27 from 11.3 MB (over the limit, rejected) to
# under it. assets/lib/** keeps the archives; assets/alpine and assets/PROVENANCE
# are excluded.
#
# This budget is also why the set of PUBLISHED host archives is smaller than the
# set of SUPPORTED hosts. build.rs accepts x86_64-unknown-linux-gnu and
# src/lib.rs compiles for it, but no third archive is committed: each one is
# ~24 MB, and the two already here leave no room. An x86_64 Linux consumer
# therefore builds the archive from this checkout —
# `cmake --build <dir> --target refresh-crate-archives-linux`, which build.rs
# names when the asset is absent. Adding a third archive to the published crate
# is a deliberate publication decision (it needs the budget solved first), not
# an automatic consequence of a host becoming supported.
include = [
    "Cargo.toml",
    "README.md",
    "build.rs",
    "assets/lib/**",
    "examples/**",
    "src/**",
]

[lib]
name = "hl_engine"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
